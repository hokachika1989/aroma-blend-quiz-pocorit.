<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アロマブレンド診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #DAD5C6;
    --surface: #F8F6EF;
    --ink: #332F28;
    --ink-soft: #6B6559;
    --line: #C7BFAC;
    --floral: #7C6A8E;
    --floral-soft: #E9E3EE;
    --citrus: #A87A3B;
    --citrus-soft: #F0E4CE;
    --herb: #5C7059;
    --herb-soft: #E1E6D9;
    --wood: #6E5640;
    --wood-soft: #EAE0D1;
    --warn-bg: #F2E8D6;
    --warn-line: #CCAD7C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #EFEAD9 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .stage{
    width:100%;
    max-width:560px;
  }
  .shop-brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:20px;
  }
  .shop-brand img{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
  }
  .shop-brand .shop-text{
    text-align:left;
  }
  .shop-brand .shop-name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:20px;
    color:var(--ink);
    line-height:1.2;
  }
  .shop-brand .shop-ig{
    font-size:13px;
    color:var(--floral);
    text-decoration:none;
  }
  .shop-brand .shop-ig:hover{ text-decoration:underline; }

  .brand{
    text-align:center;
    margin-bottom:22px;
  }
  .brand .kicker{
    font-size:13px;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(26px, 6vw, 34px);
    margin:0;
    line-height:1.3;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px 28px;
    box-shadow:0 1px 0 rgba(37,52,36,0.04);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:5px;
    background:linear-gradient(90deg, var(--herb), var(--floral) 50%, var(--citrus));
  }
  .progress{
    display:flex;
    gap:6px;
    margin-bottom:26px;
  }
  .progress .dot{
    flex:1;
    height:4px;
    border-radius:2px;
    background:var(--line);
    transition:background .3s ease;
  }
  .progress .dot.done{ background:var(--herb); }
  .progress .dot.current{ background:var(--floral); }

  .step-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  h2.question{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:22px;
    line-height:1.5;
    margin:0 0 22px 0;
  }
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media (max-width:420px){
    .options{ grid-template-columns:1fr; }
  }
  .option{
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:14px 16px;
    font-size:15px;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
    color:var(--ink);
  }
  .option:hover{ border-color:var(--herb); }
  .option.selected{
    background:var(--herb-soft);
    border-color:var(--herb);
    font-weight:500;
  }
  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:26px;
  }
  .btn{
    border:none;
    border-radius:999px;
    padding:11px 22px;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    transition:opacity .15s ease, transform .1s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background:var(--ink);
    color:#fff;
  }
  .btn-primary:disabled{
    opacity:.35;
    cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    padding-left:8px;
  }
  .btn-ghost:disabled{
    visibility:hidden;
  }

  /* Result */
  .result-kicker{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .result-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 6px 0;
  }
  .result-sub{
    color:var(--ink-soft);
    font-size:15px;
    margin-bottom:22px;
    line-height:1.6;
  }
  .oil-chips{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:24px;
  }
  .oil-card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface);
  }
  .oil-card .oil-icon{
    flex-shrink:0;
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
  }
  .oil-card.family-citrus .oil-icon{ background:var(--citrus-soft); }
  .oil-card.family-floral .oil-icon{ background:var(--floral-soft); }
  .oil-card.family-herb .oil-icon{ background:var(--herb-soft); }
  .oil-card.family-wood .oil-icon{ background:var(--wood-soft); }
  .oil-card .oil-info{
    flex:1;
    min-width:0;
  }
  .oil-card .oil-name{
    font-weight:500;
    font-size:15px;
  }
  .oil-card .oil-family{
    font-size:12px;
    color:var(--ink-soft);
  }
  .oil-card .oil-link{
    font-size:12px;
    color:var(--ink-soft);
    text-decoration:none;
    white-space:nowrap;
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 10px;
    flex-shrink:0;
  }
  .oil-card .oil-link:hover{ border-color:var(--floral); color:var(--floral); }

  .section-title{
    font-size:13px;
    letter-spacing:.02em;
    color:var(--ink-soft);
    margin:22px 0 10px 0;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
  }
  ul.recipe-list{
    margin:0;
    padding-left:20px;
    line-height:1.9;
  }
  ol.steps-list{
    margin:0;
    padding-left:20px;
    line-height:1.9;
  }
  .warn-box{
    background:var(--warn-bg);
    border:1px solid var(--warn-line);
    border-radius:12px;
    padding:14px 16px;
    font-size:14px;
    line-height:1.75;
    margin-top:22px;
  }
  .warn-box strong{ display:block; margin-bottom:6px; }
  .product-card{
    display:flex;
    gap:14px;
    align-items:flex-start;
    background:var(--floral-soft);
    border:1px solid #E1D8ED;
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:4px;
  }
  .product-card .dot-mark{
    width:10px;height:10px;
    border-radius:50%;
    background:var(--floral);
    margin-top:6px;
    flex-shrink:0;
  }
  .product-card .p-name{
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:600;
    margin:0 0 2px 0;
  }
  .product-card .p-type{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .product-card .p-desc{
    font-size:14px;
    line-height:1.7;
    margin-bottom:8px;
  }
  .product-card .p-usage{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .restart{
    margin-top:26px;
    text-align:center;
  }
  .restart button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:999px;
    padding:10px 20px;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
  }
  .restart button:hover{ border-color:var(--herb); }

  .hidden{ display:none; }
</style>
</head>

    <path d="M8.2 13.5H15.8" stroke="${colorVar}" stroke-width="1.6" stroke-linecap="round"/>
  </svg>`;
}

function pickProduct(){
  const purpose = answers.purpose;
  const scene = answers.scene;
  if(purpose === 'sleep') return 'serenity';
  if(purpose === 'relax') return scene === 'night' ? 'serenity' : 'adaptiv';
  if(purpose === 'focus') return 'citrusBliss';
  if(purpose === 'refresh') return scene === 'house' ? 'purify' : 'citrusBliss';
  return 'citrusBliss';
}

/* ---------- State ---------- */

let current = 0;
const answers = {};

const progressEl = document.getElementById('progress');
const stepLabelEl = document.getElementById('stepLabel');
const questionTextEl = document.getElementById('questionText');
const optionsWrapEl = document.getElementById('optionsWrap');
const backBtn = document.getElementById('backBtn');
const quizEl = document.getElementById('quiz');
const resultEl = document.getElementById('result');

function renderProgress(){
  progressEl.innerHTML = '';
  questions.forEach((q,i)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (i < current ? ' done' : (i === current ? ' current' : ''));
    progressEl.appendChild(d);
  });
}

function renderQuestion(){
  renderProgress();
  const q = questions[current];
  stepLabelEl.textContent = q.label;
  questionTextEl.textContent = q.text;
  optionsWrapEl.innerHTML = '';
  q.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';
    btn.textContent = opt.t;
    if(answers[q.key] === opt.v){ btn.classList.add('selected'); }
    btn.addEventListener('click', ()=>{
      if(btn.dataset.locked) return; // prevent double-fire during transition
      answers[q.key] = opt.v;
      [...optionsWrapEl.children].forEach(c=>{
        c.classList.remove('selected');
        c.dataset.locked = '1';
      });
      btn.classList.add('selected');
      setTimeout(()=>{
        if(current < questions.length - 1){
          current += 1;
          renderQuestion();
        } else {
          showResult();
        }
      }, 280);
    });
    optionsWrapEl.appendChild(btn);
  });
  backBtn.disabled = current === 0;
}

backBtn.addEventListener('click', ()=>{
  if(current > 0){
    current -= 1;
    renderQuestion();
  }
});

document.getElementById('restartBtn').addEventListener('click', ()=>{
  current = 0;
  Object.keys(answers).forEach(k => delete answers[k]);
  quizEl.classList.remove('hidden');
  resultEl.classList.add('hidden');
  renderQuestion();
});

/* ---------- Recommendation logic ---------- */

function pickOils(){
  const pool = purposePools[answers.purpose];
  const scentPref = answers.scent;
  const caution = answers.caution;

  // Decide which families to draw from
  let familyOrder;
  if(scentPref && scentPref !== 'none' && pool[scentPref] && pool[scentPref].length){
    // requested family first, then the purpose's natural secondary family
    familyOrder = [scentPref, ...pool.order.filter(f => f !== scentPref)];
  } else {
    familyOrder = pool.order;
  }

  const excludePregnancy = caution === 'pregnancy';
  const excludePet = caution === 'pet';

  const chosen = [];
  const chosenIds = new Set();

  for(const fam of familyOrder){
    const list = pool[fam] || [];
    for(const id of list){
      if(chosen.length >= 2) break;
      const o = oils[id];
      if(excludePregnancy && o.pregnancy) continue;
      if(excludePet && o.pet) continue;
      if(chosenIds.has(id)) continue;
      chosen.push(id);
      chosenIds.add(id);
    }
    if(chosen.length >= 2) break;
  }

  // fallback: if still fewer than 2 (all excluded), search entire oils object
  if(chosen.length < 2){
    for(const id in oils){
      if(chosen.length >= 2) break;
      const o = oils[id];
      if(excludePregnancy && o.pregnancy) continue;
      if(excludePet && o.pet) continue;
      if(chosenIds.has(id)) continue;
      chosen.push(id);
      chosenIds.add(id);
    }
  }

  return chosen;
}

function buildRecipe(chosenIds){
  const method = answers.method;
  const caution = answers.caution;
  const names = chosenIds.map(id => oils[id].name);

  let ingredients = [];
  let steps = [];
  let warn = [];

  if(method === 'diffuser'){
    let drops = 5;
    if(caution === 'sensitive') drops = 4;
    if(caution === 'pregnancy') drops = 3;
    if(caution === 'pet') drops = 2;

    const per = Math.max(1, Math.round(drops / chosenIds.length));
    ingredients.push(`水 100ml前後（ディフューザーの規定量）`);
    chosenIds.forEach(id => ingredients.push(`${oils[id].name} ${per}滴`));

    steps = [
      'ディフューザーに規定量の水を入れる',
      '精油を垂らす',
      '電源を入れ、20〜30分を目安に香らせる（同じ空間に長時間こもらないよう換気する）',
    ];

    if(caution === 'pregnancy'){
      warn.push('香らせる時間は短め（20分程度）にし、体調の変化があればすぐに中止してください。');
    }
    if(caution === 'pet'){
      warn.push('ペット（特に猫）は精油の成分を分解しにくい体質です。ペットが自由に出入りできない部屋で使い、扉を開けて逃げ道を確保してください。');
    }
  }

  if(method === 'spray'){
    let drops = 10;
    if(caution === 'sensitive') drops = 6;
    if(caution === 'pregnancy') drops = 5;
    if(caution === 'pet') drops = 4;

    const per = Math.max(1, Math.round(drops / chosenIds.length));
    ingredients.push('無水エタノール（または高濃度のウォッカ） 10ml');
    ingredients.push('精製水 20ml');
    chosenIds.forEach(id => ingredients.push(`${oils[id].name} ${per}滴`));
    ingredients.push('遮光スプレーボトル（30ml）');

    steps = [
      '遮光スプレーボトルに無水エタノールを入れる',
      '精油を加え、フタをしてよく振り混ぜる',
      '精製水を加え、再度よく振り混ぜる',
      '使用の都度よく振ってから、空間や布製品にスプレーする',
    ];

    if(caution === 'sensitive' || caution === 'pregnancy'){
      warn.push('肌に直接かける使い方は避け、空間や寝具などにご使用ください。');
    }
  }

  if(method === 'massage'){
    let dilution = 0.01; // 1%
    if(caution === 'sensitive') dilution = 0.005;
    if(caution === 'pregnancy') dilution = 0.005;
    if(caution === 'pet') dilution = 0.0035;

    const carrierMl = 30;
    const totalDrops = Math.max(2, Math.round(carrierMl * dilution * 20)); // 1 drop ≈ 0.05ml
    const per = Math.max(1, Math.round(totalDrops / chosenIds.length));

    ingredients.push(`キャリアオイル（ホホバオイルなど） ${carrierMl}ml`);
    chosenIds.forEach(id => ingredients.push(`${oils[id].name} ${per}滴`));
    ingredients.push('遮光ビン（保存用）');

    steps = [
      '遮光ビンにキャリアオイルを入れる',
      '精油を滴下し、フタをしてよく振って混ぜる',
      '二の腕の内側などに少量つけ、24〜48時間は肌の様子を見る',
      '問題がなければ、気になる部分に少量なじませる',
    ];

    warn.push('必ず植物油（キャリアオイル）で希釈してから肌に使用してください。精油の原液を直接肌につけないでください。');
    if(caution === 'sensitive'){
      warn.push('通常より低い濃度にしています。使用前のパッチテストを必ず行ってください。');
    }
    if(caution === 'pregnancy'){
      warn.push('低濃度にしていますが、体調や時期によって使用を避けたほうがよい場合があります。ご使用前に医師に相談してください。');
    }
    if(caution === 'pet'){
      warn.push('ペットのいる環境では低濃度にしていますが、使用後はペットが触れない場所で保管してください。');
    }
    const hasPhoto = chosenIds.some(id => oils[id].photo);
    if(hasPhoto){
      const photoNames = chosenIds.filter(id => oils[id].photo).map(id => oils[id].name).join('・');
      warn.push(`${photoNames}は光毒性があります。塗布後12時間ほどは、その部位を直射日光やUV(日焼けサロン等含む)に当てないでください。`);
    }
  }

  return {ingredients, steps, warn, names};
}

function showResult(){
  const chosen = pickOils();
  const {ingredients, steps, warn} = buildRecipe(chosen);
  const meta = purposeMeta[answers.purpose];

  document.getElementById('resultTitle').textContent = meta.title;
  document.getElementById('resultSub').textContent =
    `${meta.adj}、${chosen.map(id=>oils[id].name).join('と')}の組み合わせです。`;

  const chipsWrap = document.getElementById('oilChips');
  chipsWrap.innerHTML = '';
  chosen.forEach(id=>{
    const o = oils[id];
    const card = document.createElement('div');
    card.className = 'oil-card family-' + o.family;
    card.innerHTML = `
      <span class="oil-icon">${bottleIconSVG(o.family)}</span>
      <div class="oil-info">
        <div class="oil-name">${o.name}</div>
        <div class="oil-family">${familyLabel[o.family]}・シングルオイル</div>
      </div>
      <a class="oil-link" href="https://www.doterra.com/JP/ja_JP/pl/single-oils" target="_blank" rel="noopener">商品を見る</a>
    `;
    chipsWrap.appendChild(card);
  });

  const ingList = document.getElementById('ingredients');
  ingList.innerHTML = '';
  ingredients.forEach(i=>{
    const li = document.createElement('li');
    li.textContent = i;
    ingList.appendChild(li);
  });

  const stepList = document.getElementById('stepsList');
  stepList.innerHTML = '';
  steps.forEach(s=>{
    const li = document.createElement('li');
    li.textContent = s;
    stepList.appendChild(li);
  });

  const warnBox = document.getElementById('warnBox');
  const generalWarn = 'ここでの注意表示は代表的な情報に基づく簡易的な目安で、すべての禁忌を網羅するものではありません。医療的な助言ではないため、持病がある場合や体調に不安がある場合は使用前に医師や資格を持つアロマセラピストに確認してください。異常を感じたら直ちに使用を中止し、精油は子どもの手の届かない場所に保管してください。';
  warnBox.innerHTML = '<strong>ご使用にあたっての注意</strong>' +
    [...warn, generalWarn].map(w=>`<div>・${w}</div>`).join('');

  const productId = pickProduct();
  const product = blendProducts[productId];
  const method = answers.method;
  const productWrap = document.getElementById('productPick');
  productWrap.innerHTML = `
    <div class="product-card">
      <span class="dot-mark family-${product.family}" style="background:var(--${product.family})"></span>
      <div style="flex:1;">
        <p class="p-name">${product.name}</p>
        <div class="p-type">${product.type}（既製品ブレンド）</div>
        <p class="p-desc">${product.desc}</p>
        <div class="p-usage">使い方の目安：${product.usage[method]}</div>
        <a class="oil-link" style="display:inline-block; margin-top:8px;" href="https://www.doterra.com/JP/ja_JP/pl/proprietary-blends" target="_blank" rel="noopener">商品を見る</a>
      </div>
    </div>
    <div class="warn-box" style="margin-top:10px;">
      <strong>既製品ブレンドをご使用の際も</strong>
      <div>・複数の精油が配合されているため、初めて使う際はパッチテストをおすすめします。</div>
      <div>・敏感肌・妊娠中・授乳中・お子様やペットが身近にいる場合は、まず少量・低濃度から試し、心配な場合は購入先の製品情報や専門家に確認してください。</div>
    </div>
  `;

  quizEl.classList.add('hidden');
  resultEl.classList.remove('hidden');
}

renderQuestion();
